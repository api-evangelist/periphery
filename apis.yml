name: Periphery
description: >-
  Periphery is a cybersecurity company providing embedded, device-level threat
  management for critical industrial and defence platforms. Its lightweight,
  architecture-agnostic agent secures, fingerprints, and continuously monitors
  devices, detecting unauthorized changes and hardening what is risky even in
  constrained, offline, or air-gapped environments. The platform spans three
  products: Insights (point-in-time security evaluation with agent-based
  pen-testing and SBOM risk analysis), Vantage (on-prem intelligence that
  establishes a known-good baseline, detects change, and restores devices), and
  Outpost (real-time on-device threat detection and prevention for air-gapped
  deployments). Periphery targets regulatory compliance across NDAA, EU CRA,
  NIS2, UN R155, UN R156, and IEC 62443. It is a Techstars portfolio company.
